<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Withstand | Building Qatar's Future</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ---------- CSS Variables ---------- */
    :root {
      --bg-body: #ffffff;
      --bg-card: #ffffff;
      --bg-card-solid: #ffffff;
      --text-primary: #0f1419;
      --text-secondary: #56606b;
      --border-light: rgba(0, 0, 0, 0.08);
      --border-medium: rgba(0, 0, 0, 0.14);
      --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.15);
      --grey-accent: #6b7280;
      --grey-accent-hover: #4b5563;
      --grey-soft: rgba(107, 114, 128, 0.1);
      --gold: #c4a35a;
      --gold-soft: rgba(196, 163, 90, 0.12);
      --header-bg: rgba(255, 255, 255, 0.94);
      --toggle-bg: #e2e8f0;
      --toggle-knob: #ffffff;
      --mobile-menu-bg: #ffffff;
      --nav-text: #1a202c;
      --nav-hover-bg: rgba(107, 114, 128, 0.08);
    }

    [data-theme="dark"] {
      --bg-body: #0a0f1a;
      --bg-card: #111827;
      --bg-card-solid: #111827;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border-light: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.14);
      --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.6);
      --grey-accent: #9ca3af;
      --grey-accent-hover: #d1d5db;
      --grey-soft: rgba(156, 163, 175, 0.15);
      --gold: #d4b56a;
      --gold-soft: rgba(212, 181, 106, 0.15);
      --header-bg: rgba(10, 15, 26, 0.94);
      --toggle-bg: #334155;
      --toggle-knob: #f1f5f9;
      --mobile-menu-bg: #111827;
      --nav-text: #e2e8f0;
      --nav-hover-bg: rgba(156, 163, 175, 0.12);
    }

    /* ---------- Global Reset ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-primary);
      transition: background-color 0.4s ease, color 0.3s ease;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    [dir="rtl"] body,
    [dir="rtl"] {
      font-family: 'Noto Kufi Arabic', 'Inter', sans-serif;
    }

    [lang="hi"] body,
    [lang="hi"] {
      font-family: 'Noto Sans Devanagari', 'Inter', sans-serif;
    }

    /* ========== BACKGROUND SLIDESHOW ========== */
    .bg-slideshow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .bg-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 1.5s ease-in-out, transform 8s ease-out;
      transform: scale(1.05);
    }

    .bg-slide.active {
      opacity: 1;
      transform: scale(1);
    }

    .bg-slide::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        135deg,
        rgba(15, 20, 25, 0.82) 0%,
        rgba(15, 20, 25, 0.55) 40%,
        rgba(15, 20, 25, 0.75) 100%
      );
      transition: background 0.4s ease;
    }

    [data-theme="dark"] .bg-slide::after {
      background: linear-gradient(
        135deg,
        rgba(5, 8, 15, 0.9) 0%,
        rgba(5, 8, 15, 0.72) 40%,
        rgba(5, 8, 15, 0.85) 100%
      );
    }

    /* ========== PAGE WRAPPER ========== */
    .page-wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* ========== HEADER / NAV ========== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--header-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-light);
      transition: background 0.4s ease, box-shadow 0.3s ease;
    }

    .site-header.scrolled {
      box-shadow: var(--shadow-md);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
      gap: 1.5rem;
    }

    /* Logo */
    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      text-decoration: none;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    .brand-emblem {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--grey-accent) 0%, var(--grey-accent-hover) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.3rem;
      box-shadow: 0 4px 12px rgba(107, 114, 128, 0.35);
      position: relative;
      overflow: hidden;
    }

    .brand-emblem::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.25), transparent);
      transform: rotate(45deg);
      transition: left 0.5s;
    }

    .brand:hover .brand-emblem::after { left: 100%; }

    .brand-text { display: flex; flex-direction: column; line-height: 1.1; }

    .brand-name {
      font-weight: 900;
      font-size: 1.25rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--grey-accent);
      transition: color 0.2s;
    }

    .brand-tagline {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    /* Main Navigation */
    .main-nav { display: flex; align-items: center; }

    .nav-list {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      list-style: none;
    }

    .nav-item { position: relative; }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--nav-text);
      text-decoration: none;
      border-radius: 10px;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
      cursor: pointer;
      background: transparent;
      border: none;
      font-family: inherit;
    }

    .nav-link:hover,
    .nav-item.open > .nav-link {
      background: var(--nav-hover-bg);
      color: var(--grey-accent);
    }

    .nav-link .chevron {
      font-size: 0.6rem;
      transition: transform 0.25s ease;
      opacity: 0.6;
    }

    .nav-item.open > .nav-link .chevron { transform: rotate(180deg); }

    /* Dropdown */
    .dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 280px;
      background: var(--bg-card-solid);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      padding: 0.6rem;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
      z-index: 100;
    }

    [dir="rtl"] .dropdown { left: auto; right: 0; }

    .nav-item.open > .dropdown {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 0.9rem;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-primary);
      text-decoration: none;
      border-radius: 10px;
      transition: background 0.2s, color 0.2s, padding-left 0.2s;
      cursor: pointer;
    }

    [dir="rtl"] .dropdown-link { padding-left: 0.9rem; }

    .dropdown-link:hover {
      background: var(--grey-soft);
      color: var(--grey-accent);
      padding-left: 1.2rem;
    }

    [dir="rtl"] .dropdown-link:hover { padding-left: 0.9rem; padding-right: 1.2rem; }

    .dropdown-link i.dd-icon {
      width: 20px;
      text-align: center;
      font-size: 0.95rem;
      color: var(--gold);
    }

    .dropdown-link .dd-text { display: flex; flex-direction: column; }

    .dropdown-link .dd-title {
      font-weight: 600;
      color: var(--text-primary);
    }

    .dropdown-link .dd-desc {
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--text-secondary);
      margin-top: 1px;
    }

    /* "Coming Soon" badge */
    .soon-badge {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--grey-accent);
      background: var(--grey-soft);
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      margin-left: auto;
      white-space: nowrap;
    }

    [dir="rtl"] .soon-badge { margin-left: 0; margin-right: auto; }

    /* Header Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    /* Language Toggle — now with three options */
    .lang-switch {
      display: flex;
      background: var(--toggle-bg);
      border-radius: 40px;
      padding: 3px;
      border: 1px solid var(--border-light);
      gap: 2px;
    }

    .lang-opt {
      background: transparent;
      border: none;
      padding: 0.45rem 0.9rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.78rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .lang-opt.active {
      background: var(--grey-accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(107, 114, 128, 0.35);
    }

    .lang-opt:hover:not(.active) { color: var(--text-primary); }

    /* Theme Toggle */
    .theme-switch {
      width: 52px;
      height: 30px;
      background: var(--toggle-bg);
      border: 1px solid var(--border-light);
      border-radius: 40px;
      position: relative;
      cursor: pointer;
      transition: background 0.3s;
      display: flex;
      align-items: center;
      padding: 0 3px;
      flex-shrink: 0;
    }

    .theme-switch i {
      font-size: 0.85rem;
      color: var(--text-secondary);
      width: 18px;
      text-align: center;
      transition: opacity 0.2s;
      z-index: 1;
    }

    .theme-switch .fa-sun { opacity: 1; }
    .theme-switch .fa-moon { opacity: 0.35; }
    [data-theme="dark"] .theme-switch .fa-sun { opacity: 0.35; }
    [data-theme="dark"] .theme-switch .fa-moon { opacity: 1; }

    .theme-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      background: var(--toggle-knob);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    [data-theme="dark"] .theme-knob { transform: translateX(22px); }

    /* Mobile menu toggle */
    .menu-toggle {
      display: none;
      background: transparent;
      border: 1px solid var(--border-medium);
      border-radius: 10px;
      width: 42px;
      height: 42px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-primary);
      font-size: 1.1rem;
      transition: background 0.2s;
    }

    .menu-toggle:hover { background: var(--nav-hover-bg); }

    /* ========== HERO SECTION ========== */
    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      min-height: calc(100vh - 76px);
      padding: 5rem 0;
      position: relative;
    }

    .hero-content { max-width: 820px; }

    .hero h1 {
      font-size: clamp(2.6rem, 6.5vw, 5rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.04em;
      color: #ffffff;
      margin-bottom: 2rem;
      text-shadow: 0 2px 30px rgba(0, 0, 0, 0.4);
    }

    .hero h1 .withstand-word {
      display: block;
      font-size: 0.5em;
      font-weight: 800;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--grey-accent);
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
    }

    [data-theme="dark"] .hero h1 .withstand-word { color: #d1d5db; }

    .hero h1 .highlight {
      color: var(--gold);
      position: relative;
      display: inline-block;
    }

    /* Slideshow indicators */
    .slide-indicators {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.75rem;
      z-index: 5;
    }

    .slide-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      border: none;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s, width 0.3s;
      padding: 0;
    }

    .slide-dot.active {
      background: var(--grey-accent);
      width: 32px;
      border-radius: 10px;
    }

    .slide-dot:hover:not(.active) { background: rgba(255, 255, 255, 0.6); }

    /* ========== MOBILE MENU ========== */
    .mobile-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1500;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }

    .mobile-overlay.open { opacity: 1; visibility: visible; }

    .mobile-menu {
      position: fixed;
      top: 0;
      right: 0;
      width: min(400px, 90vw);
      height: 100vh;
      background: var(--mobile-menu-bg);
      z-index: 1600;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
      padding: 1.5rem;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.2);
    }

    [dir="rtl"] .mobile-menu { right: auto; left: 0; transform: translateX(-100%); }

    .mobile-menu.open { transform: translateX(0); }

    .mobile-menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-light);
    }

    .mobile-close {
      background: transparent;
      border: 1px solid var(--border-medium);
      border-radius: 10px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-primary);
      font-size: 1.1rem;
    }

    .mobile-nav { display: flex; flex-direction: column; gap: 0.25rem; }

    .mobile-nav-item { border-radius: 12px; overflow: hidden; }

    .mobile-nav-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-primary);
      text-decoration: none;
      border-radius: 12px;
      cursor: pointer;
      background: transparent;
      border: none;
      width: 100%;
      font-family: inherit;
      transition: background 0.2s;
    }

    .mobile-nav-link:hover { background: var(--nav-hover-bg); }

    .mobile-nav-link .chevron {
      font-size: 0.7rem;
      transition: transform 0.25s;
      opacity: 0.5;
    }

    .mobile-nav-item.open > .mobile-nav-link .chevron { transform: rotate(180deg); }

    .mobile-sub {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
      padding-left: 1rem;
    }

    [dir="rtl"] .mobile-sub { padding-left: 0; padding-right: 1rem; }

    .mobile-nav-item.open > .mobile-sub { max-height: 400px; }

    .mobile-sub-link {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1rem;
      font-size: 0.88rem;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 10px;
      transition: background 0.2s, color 0.2s;
      cursor: pointer;
    }

    .mobile-sub-link:hover {
      background: var(--grey-soft);
      color: var(--grey-accent);
    }

    .mobile-sub-link i { font-size: 0.8rem; color: var(--gold); }

    .mobile-controls {
      display: flex;
      gap: 0.75rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-light);
      flex-wrap: wrap;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 1100px) {
      .main-nav { display: none; }
      .menu-toggle { display: flex; }
    }

    @media (max-width: 640px) {
      .container { padding: 0 1.25rem; }
      .header-inner { height: 68px; gap: 0.75rem; }
      .brand-emblem { width: 38px; height: 38px; font-size: 1.1rem; }
      .brand-name { font-size: 1.05rem; }
      .brand-tagline { font-size: 0.55rem; }
      .hero { min-height: auto; padding: 3.5rem 0 4.5rem; }
      .hero h1 { font-size: clamp(2rem, 7vw, 3.5rem); }
      .lang-opt { padding: 0.35rem 0.6rem; font-size: 0.7rem; }
      .theme-switch { width: 46px; height: 27px; }
      .theme-knob { width: 21px; height: 21px; }
      [data-theme="dark"] .theme-knob { transform: translateX(19px); }
      .slide-indicators { bottom: 1.5rem; }
      .header-actions { gap: 0.5rem; }
      .dropdown { min-width: 240px; }
    }

    @media (max-width: 480px) {
      .container { padding: 0 1rem; }
      .brand-emblem { width: 34px; height: 34px; font-size: 1rem; }
      .brand-name { font-size: 0.95rem; }
      .brand-tagline { font-size: 0.5rem; }
      .lang-opt { padding: 0.3rem 0.5rem; font-size: 0.65rem; }
      .theme-switch { width: 42px; height: 25px; }
      .theme-knob { width: 19px; height: 19px; }
      [data-theme="dark"] .theme-knob { transform: translateX(17px); }
      .mobile-menu { padding: 1.25rem; }
      .hero h1 { font-size: clamp(1.8rem, 8vw, 2.8rem); }
      .hero h1 .withstand-word { font-size: 0.45em; letter-spacing: 0.25em; }
    }

    @media (max-width: 380px) {
      .hero h1 { font-size: 1.7rem; }
      .header-inner { height: 62px; }
      .lang-opt { padding: 0.25rem 0.4rem; font-size: 0.6rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-slide { transition: opacity 0.5s; transform: none !important; }
      * { animation-duration: 0.01ms !important; transition-duration: 0.1ms !important; }
    }
  </style>
</head>
<body>

  <!-- ========== BACKGROUND SLIDESHOW (5 slides) ========== -->
  <div class="bg-slideshow" aria-hidden="true">
    <div class="bg-slide active" style="background-image: url('https://ghostkmr.github.io/withstand/11.webp');"></div>
    <div class="bg-slide" style="background-image: url('https://ghostkmr.github.io/withstand/12.webp');"></div>
    <div class="bg-slide" style="background-image: url('https://ghostkmr.github.io/withstand/14.webp');"></div>
    <div class="bg-slide" style="background-image: url('https://ghostkmr.github.io/withstand/15.webp');"></div>
    <div class="bg-slide" style="background-image: url('https://ghostkmr.github.io/withstand/16.webp');"></div>
  </div>

  <div class="page-wrapper">

    <!-- ========== HEADER ========== -->
    <header class="site-header" id="siteHeader">
      <div class="container header-inner">
        <!-- Brand -->
        <a href="#" class="brand">
          <div class="brand-emblem"><i class="fas fa-shield-halved"></i></div>
          <div class="brand-text">
            <span class="brand-name" data-i18n="brandName">Withstand</span>
            <span class="brand-tagline" data-i18n="brandTagline">Building Qatar's Future</span>
          </div>
        </a>

        <!-- Desktop Nav — Home + In-Store Trackers dropdown only -->
        <nav class="main-nav" aria-label="Main navigation">
          <ul class="nav-list">
            <li class="nav-item">
              <a href="#" class="nav-link" data-i18n="navHome">Home</a>
            </li>

            <li class="nav-item" data-dropdown>
              <button class="nav-link" aria-expanded="false">
                <span data-i18n="navMenu1">In-Store Trackers</span>
                <i class="fas fa-chevron-down chevron"></i>
              </button>
              <div class="dropdown">
                <a href="https://ghostkmr.github.io/withstand/salestracker.html" class="dropdown-link">
                  <i class="fas fa-chart-bar dd-icon"></i>
                  <span class="dd-text">
                    <span class="dd-title" data-i18n="menu1Item1">Sales Tracker</span>

            <i class="fas fa-sun"></i>

          <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">

      <!-- Slideshow indicators (5 dots) -->
      <div class="slide-indicators" role="tablist" aria-label="Background slides">

        <button class="slide-dot" data-slide="1" aria-label="Slide 2"></button>

  <!-- ========== MOBILE MENU ========== -->
  <div class="mobile-overlay" id="mobileOverlay"></div>
  <aside class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <div class="mobile-menu-header">
      <div class="brand">
        <div class="brand-emblem"><i class="fas fa-shield-halved"></i></div>
        <div class="brand-text">
          <span class="brand-name" data-i18n="brandName">Withstand</span>
          <span class="brand-tagline" data-i18n="brandTagline">Building Qatar's Future</span>
        </div>
      </div>
      <button class="mobile-close" id="mobileClose" aria-label="Close menu">
        <i class="fas fa-xmark"></i>
      </button>
    </div>

    <nav class="mobile-nav">
      <div class="mobile-nav-item">
        <a href="#" class="mobile-nav-link" data-i18n="navHome">Home</a>
      </div>

      <div class="mobile-nav-item" data-mobile-dropdown>
        <button class="mobile-nav-link">
          <span data-i18n="navMenu1">In-Store Trackers</span>
          <i class="fas fa-chevron-down chevron"></i>
        </button>
        <div class="mobile-sub">
          <a href="https://ghostkmr.github.io/withstand/salestracker.html" class="mobile-sub-link"><i class="fas fa-chart-bar"></i> <span data-i18n="menu1Item1">Sales Tracker</span></a>
          <a href="#" class="mobile-sub-link"><i class="fas fa-cubes"></i> <span data-i18n="menu1Item2">Inventory Tracker</span> <span class="soon-badge" data-i18n="soon">Soon</span></a>
        </div>
      </div>
    </nav>

    <div class="mobile-controls">
      <div class="lang-switch" role="group" aria-label="Language selector">
        <button class="lang-opt active" id="langEnMobile" aria-pressed="true">EN</button>
        <button class="lang-opt" id="langArMobile" aria-pressed="false">عربي</button>
        <button class="lang-opt" id="langHiMobile" aria-pressed="false">हिं</button>
      </div>
      <button class="theme-switch" id="themeToggleMobile" role="switch" aria-checked="false" aria-label="Toggle dark mode">
        <i class="fas fa-sun"></i>
        <i class="fas fa-moon"></i>
        <span class="theme-knob"></span>
      </button>
    </div>
  </aside>

  <script>
    (function() {
      'use strict';

      /* ================= TRANSLATIONS ================= */
      const translations = {
        en: {
          brandName: "Withstand",
          brandTagline: "Building Qatar's Future",
          navHome: "Home",
          navMenu1: "In-Store Trackers",
          soon: "Soon",
          menu1Item1: "Sales Tracker",
          menu1Item1Desc: "Track your sales",
          menu1Item2: "Inventory Tracker",
          menu1Item2Desc: "Coming soon",
          heroWithstand: "Withstand",
          heroTitle1: "Building the future of",
          heroTitle2: "Qatar's enterprises"
        },
        ar: {
          brandName: "ويذستاند",
          brandTagline: "نبني مستقبل قطر",
          navHome: "الرئيسية",
          navMenu1: "متتبعات المتجر",
          soon: "قريباً",
          menu1Item1: "متتبع المبيعات",
          menu1Item1Desc: "تتبع مبيعاتك",
          menu1Item2: "متتبع المخزون",
          menu1Item2Desc: "قريباً",
          heroWithstand: "ويذستاند",
          heroTitle1: "نبني مستقبل",
          heroTitle2: "المؤسسات القطرية"
        },
        hi: {
          brandName: "विदस्टैंड",
          brandTagline: "कतर का भविष्य निर्माण",
          navHome: "होम",
          navMenu1: "इन-स्टोर ट्रैकर",
          soon: "जल्द",
          menu1Item1: "बिक्री ट्रैकर",
          menu1Item1Desc: "अपनी बिक्री ट्रैक करें",
          menu1Item2: "इन्वेंटरी ट्रैकर",
          menu1Item2Desc: "जल्द आ रहा है",
          heroWithstand: "विदस्टैंड",
          heroTitle1: "भविष्य का निर्माण",
          heroTitle2: "कतर के उद्यमों"
        }
      };

      /* ================= STATE ================= */
      let currentLang = 'en';
      let currentTheme = 'light';

      try {
        const sl = localStorage.getItem('ws-lang');
        const st = localStorage.getItem('ws-theme');
        if (sl === 'ar' || sl === 'en' || sl === 'hi') currentLang = sl;
        if (st === 'dark' || st === 'light') currentTheme = st;
      } catch (e) {}

      /* ================= DOM ================= */
      const htmlRoot = document.getElementById('htmlRoot');
      const langEn = document.getElementById('langEn');
      const langAr = document.getElementById('langAr');
      const langHi = document.getElementById('langHi');
      const langEnMobile = document.getElementById('langEnMobile');
      const langArMobile = document.getElementById('langArMobile');
      const langHiMobile = document.getElementById('langHiMobile');
      const themeToggle = document.getElementById('themeToggle');
      const themeToggleMobile = document.getElementById('themeToggleMobile');
      const i18nElements = document.querySelectorAll('[data-i18n]');
      const siteHeader = document.getElementById('siteHeader');

      /* ================= LANGUAGE ================= */
      function updateLanguage() {
        // Set lang and dir
        if (currentLang === 'ar') {
          htmlRoot.lang = 'ar';
          htmlRoot.dir = 'rtl';
        } else if (currentLang === 'hi') {
          htmlRoot.lang = 'hi';
          htmlRoot.dir = 'ltr';
        } else {
          htmlRoot.lang = 'en';
          htmlRoot.dir = 'ltr';
        }

        // Desktop buttons
        langEn.classList.toggle('active', currentLang === 'en');
        langAr.classList.toggle('active', currentLang === 'ar');
        langHi.classList.toggle('active', currentLang === 'hi');
        langEn.setAttribute('aria-pressed', currentLang === 'en');
        langAr.setAttribute('aria-pressed', currentLang === 'ar');
        langHi.setAttribute('aria-pressed', currentLang === 'hi');

        // Mobile buttons
        if (langEnMobile) {
          langEnMobile.classList.toggle('active', currentLang === 'en');
          langArMobile.classList.toggle('active', currentLang === 'ar');
          langHiMobile.classList.toggle('active', currentLang === 'hi');
          langEnMobile.setAttribute('aria-pressed', currentLang === 'en');
          langArMobile.setAttribute('aria-pressed', currentLang === 'ar');
          langHiMobile.setAttribute('aria-pressed', currentLang === 'hi');
        }

        // Translate all i18n elements
        i18nElements.forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (translations[currentLang] && translations[currentLang][key] !== undefined) {
            el.textContent = translations[currentLang][key];
          }
        });

        updateAriaLabels();
        try { localStorage.setItem('ws-lang', currentLang); } catch (e) {}
      }

      function updateAriaLabels() {
        const themeLabel = currentLang === 'ar'
          ? (currentTheme === 'dark' ? 'التبديل إلى الوضع الفاتح' : 'التبديل إلى الوضع الداكن')
          : currentLang === 'hi'
            ? (currentTheme === 'dark' ? 'लाइट मोड पर स्विच करें' : 'डार्क मोड पर स्विच करें')
            : (currentTheme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
        themeToggle.setAttribute('aria-label', themeLabel);
        if (themeToggleMobile) themeToggleMobile.setAttribute('aria-label', themeLabel);
      }

      /* ================= THEME ================= */
      function updateTheme() {
        if (currentTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          themeToggle.setAttribute('aria-checked', 'true');
          if (themeToggleMobile) themeToggleMobile.setAttribute('aria-checked', 'true');
        } else {
          document.documentElement.removeAttribute('data-theme');
          themeToggle.setAttribute('aria-checked', 'false');
          if (themeToggleMobile) themeToggleMobile.setAttribute('aria-checked', 'false');
        }
        updateAriaLabels();
        try { localStorage.setItem('ws-theme', currentTheme); } catch (e) {}
      }

      function toggleTheme() {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        updateTheme();
      }

      /* ================= EVENT LISTENERS ================= */
      langEn.addEventListener('click', () => { if (currentLang !== 'en') { currentLang = 'en'; updateLanguage(); } });
      langAr.addEventListener('click', () => { if (currentLang !== 'ar') { currentLang = 'ar'; updateLanguage(); } });
      langHi.addEventListener('click', () => { if (currentLang !== 'hi') { currentLang = 'hi'; updateLanguage(); } });
      if (langEnMobile) langEnMobile.addEventListener('click', () => { if (currentLang !== 'en') { currentLang = 'en'; updateLanguage(); } });
      if (langArMobile) langArMobile.addEventListener('click', () => { if (currentLang !== 'ar') { currentLang = 'ar'; updateLanguage(); } });
      if (langHiMobile) langHiMobile.addEventListener('click', () => { if (currentLang !== 'hi') { currentLang = 'hi'; updateLanguage(); } });

      themeToggle.addEventListener('click', toggleTheme);
      themeToggle.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTheme(); }
      });
      if (themeToggleMobile) {
        themeToggleMobile.addEventListener('click', toggleTheme);
        themeToggleMobile.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTheme(); }
        });
      }

      /* ================= DESKTOP DROPDOWNS ================= */
      const dropdownItems = document.querySelectorAll('[data-dropdown]');

      function closeAllDropdowns(except) {
        dropdownItems.forEach(item => {
          if (item !== except) {
            item.classList.remove('open');
            const btn = item.querySelector('.nav-link');
            if (btn) btn.setAttribute('aria-expanded', 'false');
          }
        });
      }

      dropdownItems.forEach(item => {
        const trigger = item.querySelector('.nav-link');
        if (!trigger) return;

        trigger.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const isOpen = item.classList.contains('open');
          closeAllDropdowns(item);
          if (!isOpen) {
            item.classList.add('open');
            trigger.setAttribute('aria-expanded', 'true');
          } else {
            item.classList.remove('open');
            trigger.setAttribute('aria-expanded', 'false');
          }
        });

        let hoverTimer;
        item.addEventListener('mouseenter', () => {
          if (window.innerWidth < 1100) return;
          clearTimeout(hoverTimer);
          closeAllDropdowns(item);
          item.classList.add('open');
          trigger.setAttribute('aria-expanded', 'true');
        });

        item.addEventListener('mouseleave', () => {
          if (window.innerWidth < 1100) return;
          hoverTimer = setTimeout(() => {
            item.classList.remove('open');
            trigger.setAttribute('aria-expanded', 'false');
          }, 200);
        });
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('[data-dropdown]')) {
          closeAllDropdowns();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeAllDropdowns();
          closeMobileMenu();
        }
      });

      /* ================= MOBILE MENU ================= */
      const menuToggle = document.getElementById('menuToggle');
      const mobileMenu = document.getElementById('mobileMenu');
      const mobileOverlay = document.getElementById('mobileOverlay');
      const mobileClose = document.getElementById('mobileClose');

      function openMobileMenu() {
        mobileMenu.classList.add('open');
        mobileOverlay.classList.add('open');
        mobileMenu.setAttribute('aria-hidden', 'false');
        menuToggle.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
      }

      function closeMobileMenu() {
        mobileMenu.classList.remove('open');
        mobileOverlay.classList.remove('open');
        mobileMenu.setAttribute('aria-hidden', 'true');
        menuToggle.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
      }

      menuToggle.addEventListener('click', openMobileMenu);
      mobileClose.addEventListener('click', closeMobileMenu);
      mobileOverlay.addEventListener('click', closeMobileMenu);

      document.querySelectorAll('[data-mobile-dropdown]').forEach(item => {
        const trigger = item.querySelector('.mobile-nav-link');
        if (!trigger) return;
        trigger.addEventListener('click', (e) => {
          e.preventDefault();
          const isOpen = item.classList.contains('open');
          document.querySelectorAll('[data-mobile-dropdown]').forEach(other => {
            if (other !== item) other.classList.remove('open');
          });
          item.classList.toggle('open', !isOpen);
        });
      });

      /* ================= BACKGROUND SLIDESHOW ================= */
      const slides = document.querySelectorAll('.bg-slide');
      const dots = document.querySelectorAll('.slide-dot');
      let currentSlide = 0;
      let slideInterval = null;
      const SLIDE_DURATION = 5000;

      function goToSlide(index) {
        if (index === currentSlide) return;
        slides.forEach((s, i) => s.classList.toggle('active', i === index));
        dots.forEach((d, i) => d.classList.toggle('active', i === index));
        currentSlide = index;
      }

      function nextSlide() {
        goToSlide((currentSlide + 1) % slides.length);
      }

      function startSlideshow() {
        stopSlideshow();
        slideInterval = setInterval(nextSlide, SLIDE_DURATION);
      }

      function stopSlideshow() {
        if (slideInterval) { clearInterval(slideInterval); slideInterval = null; }
      }

      dots.forEach((dot, i) => {
        dot.addEventListener('click', () => {
          goToSlide(i);
          startSlideshow();
        });
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { stopSlideshow(); }
        else { startSlideshow(); }
      });

      startSlideshow();

      /* ================= HEADER SCROLL ================= */
      let scrollTick = false;
      window.addEventListener('scroll', () => {
        if (!scrollTick) {
          window.requestAnimationFrame(() => {
            if (window.scrollY > 20) siteHeader.classList.add('scrolled');
            else siteHeader.classList.remove('scrolled');
            scrollTick = false;
          });
          scrollTick = true;
        }
      });

      /* ================= INIT ================= */
      updateTheme();
      updateLanguage();

    })();
  </script>
</body>
